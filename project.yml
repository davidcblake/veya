# What the Xcode project is, in a file a person can read.
# `xcodegen generate` turns this into VEYA.xcodeproj, which is not committed.
name: VEYA

options:
  bundleIdPrefix: com.wpv
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  PlugAndPlay:
    url: https://github.com/davidcblake/plug-and-play-ios
    from: 0.1.0

targets:
  VEYA:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    dependencies:
      - package: PlugAndPlay
        product: PPCore
      - package: PlugAndPlay
        product: PPData
      - package: PlugAndPlay
        product: PPDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wpv.veya
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # A build with no icon is rejected before review even starts.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Off so CI builds without certificates. Xcode turns it on for a real
        # build; TestFlight cannot accept an unsigned one.
        CODE_SIGNING_ALLOWED: NO
    entitlements:
      path: VEYA.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: VEYA
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The app talks to its backend over Apple's own HTTPS and uses no
        # encryption beyond it, which is the exempt case. Answered here so App
        # Store Connect stops asking on every upload.
        ITSAppUsesNonExemptEncryption: false
        # Where the trip lives. The anon key belongs in the app -- it names the
        # project, not a person, and row level security is what actually
        # protects the data (supabase/0001_init.sql).
        SUPABASE_URL: https://nacssflxldickvbvxwjh.supabase.co
        SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hY3NzZmx4bGRpY2t2YnZ4d2poIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMjY2ODAsImV4cCI6MjEwNDkwMjY4MH0.N9rFMRFOSuOMPutDAhjyqbaC2LcgeejJ4GPCnjy26Bw

